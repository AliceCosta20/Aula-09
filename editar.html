
<!DOCTYPE html>

   <body>
    <main class="container">
        <h1>Editar Pessoa</h1>
        <form id="formEditar">
            <label for="nome">Nome</label>

            <label for="Idade">Idade</label>

            <div class="acoes">

        </form>
        <p id="mensagem" role="status"></p>
    </main>
